name: Build & Push SSLeech Base Image

on:
  # Manually trigger from GitHub website (phone se bhi ho sakta hai!)
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag (e.g. latest, v2, v3)'
        required: false
        default: 'latest'

  # Jab bhi Dockerfile.base change ho, auto build ho
  push:
    branches: [ lp ]
    paths:
      - 'Dockerfile.base'

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      # ── 1. Code checkout ──────────────────────────────────
      - name: Checkout repo
        uses: actions/checkout@v4

      # ── 2. QEMU — multi-arch support (amd64 + arm64) ─────
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      # ── 3. Docker Buildx setup ────────────────────────────
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ── 4. Docker Hub login ───────────────────────────────
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # ── 5. Build & Push ───────────────────────────────────
      - name: Build and Push Base Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.base
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/ssleech-base:${{ github.event.inputs.tag || 'latest' }}
          # Cache layers so rebuild is faster next time
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ── 6. Done ───────────────────────────────────────────
      - name: Print image info
        run: |
          echo "✅ Image pushed successfully!"
          echo "📦 Image: ${{ secrets.DOCKERHUB_USERNAME }}/ssleech-base:${{ github.event.inputs.tag || 'latest' }}"
          echo "🔗 Docker Hub: https://hub.docker.com/r/${{ secrets.DOCKERHUB_USERNAME }}/ssleech-base"
          
